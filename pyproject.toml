[project]
name = "fcaviz"
version = "0.1.0"
description = "FCA house plotting style for Plotly: palette, layout template, colormap, and brand chrome."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "plotly>=5.20",
    "numpy>=1.24",
]

[project.optional-dependencies]
# static PNG/SVG export via save_figure() needs a Kaleido engine
export = ["kaleido"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fcaviz"]
